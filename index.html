<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mergdom: America</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1220;
  color: white;
}

/* =========================
   TOP BANNER
========================= */
#topBanner {
  width: 100%;
  text-align: center;
  padding: 18px 0;
  font-size: 26px;
  font-weight: bold;
  background: #141a2d;
  border-bottom: 1px solid #2a3358;
}

/* =========================
   MAIN LAYOUT
========================= */
#mainContainer {
  display: flex;
  justify-content: flex-start;
  align-items: flex-start;

  gap: 20px;

  /* 🔥 pushes whole layout right */
  padding: 70px 20px 40px 160px;
}

/* =========================
   WORKSPACE
========================= */
#workspace {
  flex-grow: 1;   /* 🔥 takes all remaining space */

  height: 78vh;

  border: 2px dashed #444;
  border-radius: 12px;
  background: #151a2e;

  display: flex;
  align-items: center;
  justify-content: center;

  min-width: 500px; /* prevents collapsing too much */
}

#workspace::after {
  content: "Drag elements here";
  color: #666;
  font-size: 18px;
}

/* =========================
   SIDE PANEL
========================= */
#sidePanel {
  width: 180px;
  height: 78vh;

  background: #1a1f35;
  border-radius: 12px;

  margin-left: 20px;

  overflow-y: auto;

  padding: 0 6px 6px 6px; /* 🔥 top padding removed to avoid overlap issues */

  display: flex;
  flex-direction: column;
}

#sidePanel h3 {
  position: sticky;
  top: 0;

  z-index: 20; /* 🔥 ensures it stays above elements */

  background: #1a1f35; /* 🔥 blocks anything behind it */

  text-align: center;
  margin: 0;
  padding: 12px 0;

  font-size: 18px;

  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 10px;
}

/* =========================
   ELEMENT BUTTONS (RESTORED BIG SIZE + NEW FONT)
========================= */
.element {
  background: #4a6cf7;
  border-radius: 12px;

  /* 🔥 CHUNKY BLOCK SIZE (true v12 feel) */
  height: 105px;

  display: flex;
  align-items: center;
  justify-content: center;

  /* keep your font */
  font-size: 18px;
  font-weight: bold;

  cursor: grab;
  user-select: none;

  margin-bottom: 18px;

  /* 🔥 makes it feel heavier / less flat */
  box-shadow: 0 6px 0 #2c3ea8;

  /* gives “solid tile” edges */
  border: 2px solid rgba(255,255,255,0.08);

  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

/* hover = slight lift (important for game feel) */
.element:hover {
  background: #5b7dff;
  transform: translateY(-2px);
  box-shadow: 0 8px 0 #2c3ea8;
}

/* click feel (optional but nice for drag UX) */
.element:active {
  transform: translateY(2px);
  box-shadow: 0 3px 0 #2c3ea8;
}

/* =========================
   MENU TILES
========================= */
.menuTile {
  width: 100%;
  height: 70px;

  background: #2d3b66;
  border-radius: 12px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
  user-select: none;

  /* 🔥 GAME TILE DEPTH */
  box-shadow: 0 6px 0 #1c274a;

  /* 🔥 crisp border like UI panel */
  border: 2px solid rgba(255,255,255,0.08);

  /* 🔥 smooth interaction */
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
}

/* hover = lift */
.menuTile:hover {
  background: #3f56a0;
  transform: translateY(-2px);
  box-shadow: 0 8px 0 #1c274a;
}

/* click = press down */
.menuTile:active {
  transform: translateY(2px);
  box-shadow: 0 3px 0 #1c274a;
}

/* erase stays special */
#eraseTile {
  background: #d9534f;
  box-shadow: 0 6px 0 #8f2f2c;
}

#eraseTile:hover {
  background: #ff6b6b;
  box-shadow: 0 8px 0 #8f2f2c;
}

/* =========================
   MENU STACK
========================= */
#menuButtons {
  position: fixed;

  /* 🔥 pushes it below the top banner */
  top: 90px;

  left: 20px;

  height: calc(100vh - 110px);

  width: 110px;

  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* =========================
   MODALS
========================= */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  align-items: center;
  justify-content: center;
}

.modalContent {
  width: 500px;      /* 🔥 wider */
  height: 360px;     /* 🔥 taller */

  background: #1a1f35;
  border-radius: 14px;

  padding: 24px;

  /* 🔥 gives depth like your other UI elements */
  box-shadow: 0 10px 0 #0d1020;

  border: 2px solid rgba(255,255,255,0.08);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;
}

.settingsPanel {
  width: 550px;
  height: 420px;

  background: #1a1f35;
  border-radius: 14px;

  padding: 30px;

  box-shadow: 0 10px 0 #0d1020;
  border: 2px solid rgba(255,255,255,0.08);

  display: flex;
  flex-direction: column;
  align-items: center;     /* 🔥 center everything horizontally */
  justify-content: center;  /* 🔥 center vertically */

  gap: 22px;

  font-size: 20px; /* 🔥 bigger base font */
  text-align: center;
}

.settingItem {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 10px;

  font-size: 18px;
}

.settingsButton {
  padding: 14px 18px;   /* 🔥 bigger click area */
  font-size: 16px;

  border-radius: 10px;
  border: none;

  cursor: pointer;

  background: #2d3b66;
  color: white;

  font-weight: bold;

  width: 90%; /* 🔥 makes it feel like a full control bar */

  transition: transform 0.1s ease, background 0.2s ease;
}

.settingsButton:hover {
  background: #3f56a0;
  transform: scale(1.02);
}

.settingsButton.danger {
  background: #d9534f;
}

.settingsButton.danger:hover {
  background: #ff6b6b;
}

#volumeSlider {
  width: 90%;
  height: 6px;
}

.accountPanel {
  width: 500px;
  height: 380px;

  background: #1a1f35;
  border-radius: 14px;

  padding: 30px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 18px;

  color: white;
  text-align: center;
}

#accountStatus {
  font-size: 16px;
  opacity: 0.8;
}

.accountPanel input {
  width: 80%;
  padding: 12px;

  border-radius: 8px;
  border: none;

  font-size: 14px;
}

.accountButtons {
  display: flex;
  gap: 10px;
}

.accountButtons button {
  padding: 10px 14px;

  border-radius: 8px;
  border: none;

  cursor: pointer;

  background: #2d3b66;
  color: white;

  font-weight: bold;
}

.accountButtons button:hover {
  background: #3f56a0;
}

</style>
</head>
<body>

<div id="topBanner">
  Mergdom: America
</div>

<!-- MENU -->
<div id="menuButtons">

  <!-- TOP SECTION -->
  <div class="menuTile" onclick="openModal('accountModal')">Account</div>
  <div class="menuTile" onclick="openModal('encyclopediaModal')">Encyclopedia</div>

  <!-- spacer (creates separation) -->
  <div style="flex: 1;"></div>

  <!-- BOTTOM SECTION -->
  <div class="menuTile" onclick="openModal('settingsModal')">Settings</div>
  <div id="eraseTile" class="menuTile" onclick="clearWorkspace()">Erase</div>

</div>
<!-- MAIN -->
<div id="mainContainer">

  <div id="workspace"></div>

  <div id="sidePanel">
    <h3>Elements</h3>

    <div class="element">Water</div>
    <div class="element">Fire</div>
    <div class="element">Earth</div>
    <div class="element">Air</div>
    <div class="element">Metal</div>
    <div class="element">People</div>
    <div class="element">Idea</div>
    <div class="element">Trade</div>
    <div class="element">Technology</div>
    <div class="element">War</div>
    <div class="element">Power</div>
    <div class="element">Life</div>
    <div class="element">Energy</div>
    <div class="element">City</div>
  </div>

</div>

<!-- MODALS -->
<div id="settingsModal" class="modal" onclick="closeModal(event,'settingsModal')">
  <div class="modalContent settingsPanel">

    <h2>Settings</h2>

    <!-- SOUND -->
    <div class="settingItem">
      <label>Music Volume</label>
      <input type="range" min="0" max="100" value="50" id="volumeSlider">
    </div>

    <!-- DARK MODE -->
    <div class="settingItem">
      <label>Theme</label>
      <button onclick="toggleTheme()" class="settingsButton">
        Toggle Dark / Light Mode
      </button>
    </div>

    <!-- RESET -->
    <div class="settingItem">
      <label>Progress</label>
      <button onclick="resetProgress()" class="settingsButton danger">
        Reset Progress
      </button>
    </div>

  </div>
</div>

<div id="encyclopediaModal" class="modal" onclick="closeModal(event,'encyclopediaModal')">
  <div class="modalContent"><h3>Encyclopedia</h3></div>
</div>

<div id="accountModal" class="modal" onclick="closeModal(event,'accountModal')">
  <div class="modalContent accountPanel">

    <h2>Account</h2>

    <!-- USER STATUS -->
    <div id="accountStatus">Not logged in</div>

    <!-- USERNAME INPUT -->
    <input type="text" id="usernameInput" placeholder="Enter username">

    <!-- PASSWORD INPUT -->
    <input type="password" id="passwordInput" placeholder="Enter password">

    <!-- BUTTONS -->
    <div class="accountButtons">
      <button onclick="signup()">Sign Up</button>
      <button onclick="login()">Log In</button>
      <button onclick="logout()">Log Out</button>
    </div>

  </div>
</div>

<script>
function openModal(id){
  document.getElementById(id).style.display="flex";
}
function closeModal(e,id){
  if(e.target.classList.contains("modal")){
    document.getElementById(id).style.display="none";
  }
}
function clearWorkspace() {
  if (!confirm("Erase all placed elements?"))
    return;

  const workspace = document.getElementById("workspace");
  workspace.innerHTML = "";

  // remove all placed elements
  workspace.querySelectorAll(".element").forEach(el => el.remove());

  // reset any internal game state later (placeholder)
  console.log("Workspace cleared");
}
function toggleTheme() {
  document.body.classList.toggle("light-mode");
}

/* example light mode */
const lightStyle = document.createElement("style");
lightStyle.innerHTML = `
body.light-mode {
  background: #f2f2f2;
  color: #111;
}

body.light-mode #workspace {
  background: #ffffff;
  border-color: #ccc;
}

body.light-mode #sidePanel {
  background: #e8e8e8;
}

body.light-mode .menuTile {
  background: #dddddd;
  color: black;
}
`;
document.head.appendChild(lightStyle);

function resetProgress() {
  if (confirm("Reset all progress? This cannot be undone.")) {
    localStorage.clear();
    location.reload();
  }
}
</script>

/* =========================

if (error) {

/* =========================

========================= */
window.login = async function () {
  const email = document.getElementById("usernameInput").value;
  const password = document.getElementById("passwordInput").value;

  const { data, error } = await supabase.auth.signInWithPassword({

   LOGOUT
========================= */
window.logout = async function () {
  await supabase.auth.signOut();
  document.getElementById("accountStatus").innerText = "Not logged in";
};

supabase.auth.onAuthStateChange((event, session) => {
  console.log("AUTH EVENT:", event, session);
});

/* =========================
   LIVE STATUS
========================= */
supabase.auth.onAuthStateChange((event, session) => {
  if (session?.user) {

</body>
</html>
